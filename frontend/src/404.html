<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Servicio Autónomo Hospital Universitario de Maracaibo" />
  <meta name="author" content="Ing. Edgar Boscan">
  <meta name="robots" content="index, follow">
  <title>404 - Página no encontrada</title>
  <link rel="icon" href="./assets/img/logo.png" type="image/png" />
  <link rel="stylesheet" href="./node_modules/normalize.css/normalize.css" />
  <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="./node_modules/animate.css/animate.css" />
  <link rel="stylesheet" href="./css/all.css" />
  <link rel="stylesheet" href="./css/style.css" />
  <style>
    body {
      background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Roboto', Arial, sans-serif;
    }

    .error-container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
      padding: 48px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      animation: fadeInDown 1s;
    }

    .error-code {
      font-size: 7rem;
      font-weight: 700;
      color: #ff6b6b;
      margin-bottom: 0.5rem;
      letter-spacing: 2px;
      text-shadow: 2px 2px 0 #f8f9fa;
    }

    .error-title {
      font-size: 2rem;
      font-weight: 500;
      color: #343a40;
      margin-bottom: 1rem;
    }

    .error-message {
      font-size: 1.1rem;
      color: #6c757d;
      margin-bottom: 2rem;
    }

    .illustration {
      margin-bottom: 2rem;
      animation: pulse 2s infinite;
    }

    .btn-home {
      background: #ff6b6b;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.75rem 2rem;
      font-size: 1rem;
      font-weight: 500;
      transition: background 0.2s;
      box-shadow: 0 2px 8px rgba(255, 107, 107, 0.15);
      text-decoration: none;
      display: inline-block;
    }

    .btn-home:hover {
      background: #fa5252;
      color: #fff;
      text-decoration: none;
    }

    @media (max-width: 600px) {
      .error-container {
        padding: 32px 8px;
      }

      .error-code {
        font-size: 4rem;
      }
    }
  </style>
</head>

<body>
  <main class="error-container">
    <img src="./assets/img/logo.png" alt="Logo SAHUM" width="60" height="60" style="margin-bottom: 1rem;" />
    <div class="error-code">404</div>
    <h1 class="error-title">¡Ups! Página no encontrada</h1>
    <p class="error-message">
      Lo sentimos, la página que buscas no existe o ha sido movida.<br>
      Por favor, verifica la URL o vuelve al inicio.
    </p>
    <div class="illustration">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="120" height="72">
        <circle cx="250" cy="150" r="120" fill="#f8f9fa" stroke="#ff6b6b" stroke-width="8" />
        <circle cx="210" cy="120" r="10" fill="#333" />
        <circle cx="290" cy="120" r="10" fill="#333" />
        <path d="M210 170 Q250 190 290 170" stroke="#333" stroke-width="5" fill="none" />
        <path d="M180 80 L150 50" stroke="#ff6b6b" stroke-width="8" stroke-linecap="round" />
        <path d="M320 80 L350 50" stroke="#ff6b6b" stroke-width="8" stroke-linecap="round" />
        <path d="M180 220 L150 250" stroke="#ff6b6b" stroke-width="8" stroke-linecap="round" />
        <path d="M320 220 L350 250" stroke="#ff6b6b" stroke-width="8" stroke-linecap="round" />
      </svg>
    </div>
    <a href="index.html" class="btn-home">Volver al inicio</a>
  </main>
</body>

</html>
